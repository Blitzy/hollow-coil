{
    // Mandrel.js game config for TrenchBroom.
    // Install with: npm run install-trenchbroom
    // Set the game path in Preferences > Games > Mandrel.js to the repo root (holding maps/ and textures/).
    //
    // Maps use the Quake 2 (Valve) format and compile with qbsp -q2bsp (see docs/DECISIONS.md).
    // Tags and face attributes are adapted from TrenchBroom's bundled Quake 2 config (GPLv3).
    "version": 9,
    "name": "Mandrel.js",
    "fileformats": [
        { "format": "Quake2 (Valve)" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "extensions": [ ".png" ]
    },
    "entities": {
        "definitions": [ "mandrel.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "contentflag",
                "flags": [ "playerclip", "monsterclip" ]
            },
            {
                "name": "Detail",
                "match": "contentflag",
                "flags": [ "detail" ]
            },
            {
                "name": "Hint",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": [ "hint" ]
            },
            {
                "name": "Liquid",
                "match": "contentflag",
                "flags": [ "lava", "slime", "water" ]
            },
            {
                "name": "Nodraw",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": [ "nodraw" ]
            },
            {
                "name": "Skip",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": [ "skip" ]
            },
            {
                "name": "Sky",
                "match": "surfaceflag",
                "flags": [ "sky" ]
            },
            {
                "name": "Transparent",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": [ "trans33", "trans66" ]
            }
        ]
    },
    // Flag positions are bit positions and must match Quake 2 / qbsp; "unused" entries hold their place.
    "faceattribs": {
        "surfaceflags": [
            { "name": "light", "description": "Emit light from the surface; brightness is the 'value' field" }, // 1 << 0
            { "name": "slick", "description": "The surface is slippery" }, // 1 << 1
            { "name": "sky", "description": "Sky surface; not drawn, the sky is shown instead" }, // 1 << 2
            { "name": "warp", "description": "The surface warps, like water" }, // 1 << 3
            { "name": "trans33", "description": "33% transparent" }, // 1 << 4
            { "name": "trans66", "description": "66% transparent" }, // 1 << 5
            { "name": "flowing", "description": "Texture scrolls downward (warp must also be set)" }, // 1 << 6
            { "name": "nodraw", "description": "Not drawn; for clip and trigger brushes" }, // 1 << 7
            { "name": "hint", "description": "Make a primary BSP splitter" }, // 1 << 8
            { "name": "skip", "description": "Ignored by the compiler, allowing non-closed brushes" } // 1 << 9
        ],
        "contentflags": [
            { "name": "solid", "description": "Default for all brushes" }, // 1 << 0
            { "name": "window", "description": "Window (rarely used)" }, // 1 << 1
            { "unused": true }, // 1 << 2
            { "name": "lava", "description": "The brush is lava" }, // 1 << 3
            { "name": "slime", "description": "The brush is slime" }, // 1 << 4
            { "name": "water", "description": "The brush is water" }, // 1 << 5
            { "name": "mist", "description": "Non-solid brush" }, // 1 << 6
            { "unused": true }, // 1 << 7
            { "unused": true }, // 1 << 8
            { "unused": true }, // 1 << 9
            { "unused": true }, // 1 << 10
            { "unused": true }, // 1 << 11
            { "unused": true }, // 1 << 12
            { "unused": true }, // 1 << 13
            { "unused": true }, // 1 << 14
            { "unused": true }, // 1 << 15
            { "name": "playerclip", "description": "Blocks the player only" }, // 1 << 16
            { "name": "monsterclip", "description": "Blocks enemies only" }, // 1 << 17
            { "unused": true }, // 1 << 18
            { "unused": true }, // 1 << 19
            { "unused": true }, // 1 << 20
            { "unused": true }, // 1 << 21
            { "unused": true }, // 1 << 22
            { "unused": true }, // 1 << 23
            { "name": "origin", "description": "Origin brush for rotating brush entities" }, // 1 << 24
            { "unused": true }, // 1 << 25
            { "unused": true }, // 1 << 26
            { "name": "detail", "description": "Detail brush; does not split the BSP or block visibility" }, // 1 << 27
            { "name": "translucent", "description": "Does not block visibility" }, // 1 << 28
            { "name": "ladder", "description": "Climbable surface" } // 1 << 29
        ]
    },
    "softMapBounds": "-4096 -4096 -4096 4096 4096 4096"
}
