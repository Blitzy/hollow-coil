name: Maps

# Compiles maps only when something that affects them changes, to save CI
# minutes (see "CI compiles maps in check mode" in docs/DECISIONS.md). Also
# runs the tool tests that need ericw-tools, which the web workflow skips.
# Keep these path lists in sync.
on:
  push:
    branches: [main]
    paths:
      - "maps/**"
      - "textures/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/maps.yml"
  pull_request:
    paths:
      - "maps/**"
      - "textures/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/maps.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Lighting quality
        type: choice
        options: [check, release]
        default: check

concurrency:
  group: maps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile maps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'check' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Cache tool downloads
        uses: actions/cache@v6
        with:
          path: .tools/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('tools/versions.json') }}

      - name: Install pinned tools
        run: npm run setup -- ericw-tools

      - name: Test tools (with ericw-tools)
        run: npx vitest run tools

      - name: Compile maps (${{ env.MODE }} mode)
        run: npm run compile -- --mode "$MODE"

      - name: Upload release build
        if: env.MODE == 'release'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maps-release
          path: build/*.bsp
          retention-days: 7
