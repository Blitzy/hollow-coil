name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check file sizes
        run: python tools/check_files.py

      - name: Validate data
        run: python tools/validate.py

      - name: Test data validator
        run: python -m unittest discover -s tools/tests -p "test_validate.py" -v

  # Map compiles run in maps.yml, only when map-related files change.
  # Engine jobs (web: Vitest, godot: gdUnit4 headless) are added in milestone M1.
