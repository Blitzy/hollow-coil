name: CI

# One job for everything: setup (checkout, Node, npm ci) is most of the run,
# and GitHub bills each job rounded up to a whole minute, so one job is cheaper
# than several (see "CI is one job" in docs/DECISIONS.md). Docs-only changes skip it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, test, and compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Cache tool downloads
        uses: actions/cache@v6
        with:
          # The per-user tools cache on Linux (toolsCacheDir in tools/src/layout.ts).
          path: ~/.cache/mandreljs/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('tools/versions.json') }}

      # Before the tests, so the tests that need ericw-tools run instead of skipping.
      - name: Install pinned tools
        run: npm run setup -- ericw-tools

      - name: Check file sizes
        run: npm run check-files

      - name: Validate data and scenarios
        run: npm run validate

      - name: Type-check (including the sim-only check)
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fast lighting: leaks, missing textures, and compiler errors fail the build.
      - name: Check maps compile
        run: npm run compile -- --mode check

      # Packs mandreljs and runs it installed, in a game folder outside the repo.
      - name: Test the installed package
        run: npm run test:package
