name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check file sizes
        run: python tools/check_files.py

      # Added by Phase 0.7: python tools/validate.py (data files against JSON Schemas)

  # Map compiles run in maps.yml, only when map-related files change.
  # Engine jobs (web: Vitest, godot: gdUnit4 headless) are added in milestone M1.
