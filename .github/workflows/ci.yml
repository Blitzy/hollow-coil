name: CI

# One job for everything: setup (checkout, Node, npm ci) is most of the run,
# and GitHub bills each job rounded up to a whole minute, so one job is cheaper
# than several (see "CI is one job" in docs/DECISIONS.md). Docs-only pushes to main
# skip it; every pull request runs it, since main and develop require it to pass.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, test, and compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Cache tool downloads
        uses: actions/cache@v6
        with:
          # The per-user tools cache on Linux (toolsCacheDir in tools/src/layout.ts).
          path: ~/.cache/mandreljs/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('tools/versions.json') }}

      # Before the tests, so the tests that need ericw-tools run instead of skipping.
      - name: Install pinned tools
        run: npm run setup -- ericw-tools

      # Every check, in one script (see package.json), so CI and contributors run the
      # same ones: file sizes, validation, type-checking, tests, compiling every map
      # with fast lighting, and the installed mandreljs package.
      - name: Check
        run: npm run check
