name: Godot

# Runs the Godot project's gdUnit4 tests headless. Runs only when something
# it reads changes: its own code, the shared maps, data, and scenarios, the
# test fixtures it shares with the web build, or its tool pins.
# Keep these path lists in sync.
on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - "maps/**"
      - "data/**"
      - "spec/**"
      - "web/tests/fixtures/**"
      - "tools/setup.py"
      - "tools/test_godot.py"
      - "tools/versions.json"
      - ".github/workflows/godot.yml"
  pull_request:
    paths:
      - "godot/**"
      - "maps/**"
      - "data/**"
      - "spec/**"
      - "web/tests/fixtures/**"
      - "tools/setup.py"
      - "tools/test_godot.py"
      - "tools/versions.json"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The official Linux build, pinned by checksum. Locally, Godot is whatever GODOT points at.
      GODOT_VERSION: "4.7.2"
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: |
            .tools/downloads
            .tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/versions.json') }}

      - name: Install gdUnit4
        run: python tools/setup.py gdunit4

      - name: Install Godot
        run: |
          zip=".tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          if [ ! -f "$zip" ]; then
            mkdir -p .tools/godot
            curl -fsSL -o "$zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          fi
          echo "${GODOT_SHA256}  $zip" | sha256sum --check
          unzip -o -q "$zip" -d .tools/godot
          godot="$PWD/.tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot"
          "$godot" --version
          echo "GODOT=$godot" >> "$GITHUB_ENV"

      - name: Test
        run: python tools/test_godot.py
